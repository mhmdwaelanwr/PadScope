name: Package Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PadScope.sln

      - name: Build
        run: dotnet build src/PadScope.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/PadScope.sln -c Release --no-build

      - name: Publish self-contained Desktop
        run: dotnet publish src/PadScope.Desktop/PadScope.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/PadScope-win-x64

      - name: Compress package
        shell: pwsh
        run: Compress-Archive -Path artifacts/PadScope-win-x64/* -DestinationPath artifacts/PadScope-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PadScope-win-x64
          path: artifacts/PadScope-win-x64.zip

      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/PadScope-win-x64.zip --generate-notes --verify-tag
